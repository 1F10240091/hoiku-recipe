name: Product checks
on: [push, pull_request]
jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run test:frontend
      - run: npm run lint
      - run: npm run build
        env:
          NEXT_PUBLIC_API_URL: https://api.example.com
          NEXT_PUBLIC_DEMO_MODE: 'false'
      - run: npm audit --audit-level=high
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: hoiku
          POSTGRES_PASSWORD: test-only-password
          POSTGRES_DB: hoiku_test
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready --health-interval 5s
          --health-timeout 5s --health-retries 10
    defaults:
      run:
        working-directory: backend
    env:
      DATABASE_URL: postgresql+psycopg://hoiku:test-only-password@localhost:5432/hoiku_test
      TEST_DATABASE_URL: postgresql+psycopg://hoiku:test-only-password@localhost:5432/hoiku_test
      ENVIRONMENT: production
      JWT_SECRET_KEY: ci-only-7e05b7f4820d4b2c99a97a49f2a9c7f1
      CORS_ORIGINS: '["https://app.example.com"]'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: pip install -r requirements.txt -r requirements-dev.txt pip-audit
      - run: python -m app.release
      - run: alembic check
      - run: python -m pytest tests -q
      - run: pip-audit --progress-spinner off
